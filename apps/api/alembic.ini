# Alembic for the AIProtect consumer API.
#
# Run from apps/api:
#   alembic upgrade head          apply everything
#   alembic revision --autogenerate -m "what changed"
#   alembic current               what this database is at
#
# The database URL is NOT written here. It comes from AIPROTECT_DATABASE_URL
# via migrations/env.py, so migrations and the running service can never point
# at two different databases -- which is the way a migration gets reported as
# applied against something nobody is using.
[alembic]
script_location = migrations
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

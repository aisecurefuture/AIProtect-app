# AIProtect detection stack.
#
#   docker compose -f infra/docker-compose.yml up -d
#
# Build context is the repo root because production builds images on the box.
#
# This deployment is INDEPENDENT of CyberArmor.ai. Nothing here shares a
# container, a volume, or a model cache with the B2B product -- that separation
# is the point of this repository existing, and it is what keeps a consumer
# traffic spike or a free-tier abuser from being able to affect anything else.

services:
  detection:
    env_file: ["${CYBERARMOR_ENV_FILE:-.env}"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    # run_detection_service.sh chowns the /models volume (the HuggingFace cache
    # lives there and the volume can have arbitrary ownership) and then drops
    # privileges to appuser.
    cap_add: ["CHOWN", "FOWNER", "DAC_OVERRIDE", "SETGID", "SETUID"]
    build:
      context: ../
      dockerfile: services/detection/Dockerfile
    restart: unless-stopped
    # The five-model configuration this was forked from measured 5.24 GiB RSS.
    # The consumer profile drops bart-large-mnli (~1.6 GB) and
    # obi/deid_roberta_i2b2 (~1.4 GB), so the cap comes down with it. Still
    # generous on purpose: an OOM here is a restart loop that reloads weights
    # while traffic arrives, which is far worse than a cap never reached.
    mem_limit: 4g
    environment:
      # ---- THE PROFILE ------------------------------------------------
      # Enables prompt_injection + sensitive_data + toxicity, and declines to
      # run output_safety. A declined detector is NOT a broken one: it is
      # absent from MODEL_IDS, so /ready does not call it degraded, and every
      # scan response names it in `checks_skipped_by_profile`.
      CYBERARMOR_DETECTION_PROFILE: "consumer"   # repo default too; explicit here so the deployment states it

      # Only the three models this profile loads are declared. The two the
      # profile drops are deliberately absent rather than set to "" -- an
      # empty model id is a broken configuration, and this is a choice.
      ML_PROMPT_INJECTION_MODEL: "protectai/deberta-v3-base-prompt-injection-v2"
      ML_NER_PII_MODEL: "dslim/bert-base-NER"
      ML_TOXICITY_MODEL: "unitary/toxic-bert"

      # ---- Cost controls ----------------------------------------------
      # The result cache is the single highest-leverage change for a consumer
      # workload: scans are pure functions of their text, and consumer traffic
      # repeats -- the same prompts, the same handful of URLs, across users.
      # Default is OFF everywhere; this is the deployment that opts in.
      CYBERARMOR_DETECTION_CACHE_ENABLED: "true"
      CYBERARMOR_DETECTION_CACHE_TTL_S: "600"
      CYBERARMOR_DETECTION_CACHE_MAX_ENTRIES: "50000"

      # Per-client limiting. The consumer API forwards a per-account or
      # per-device x-client-id; without it every consumer request would share
      # one API key and therefore one bucket. 0 (unlimited) is the default
      # everywhere else, so the B2B pilot is untouched.
      # Per DEVICE -- fairness. One runaway device must not consume the whole
      # household's capacity.
      CYBERARMOR_DETECTION_RATE_LIMIT_RPM: "60"
      CYBERARMOR_DETECTION_RATE_LIMIT_BURST: "15"
      # Per ACCOUNT -- cost. A subscription covers many devices, so the device
      # limit alone caps nothing that matters to the bill: 10 devices x 60 rpm
      # is 600 rpm from one paying account, and Family makes that normal rather
      # than abusive. Deliberately NOT device_rpm x max_devices -- multiplying
      # would re-open the hole. See docs/MULTI-DEVICE.md.
      CYBERARMOR_DETECTION_ACCOUNT_RATE_LIMIT_RPM: "300"
      CYBERARMOR_DETECTION_ACCOUNT_RATE_LIMIT_BURST: "60"

      # ---- Things a consumer tier must not run ------------------------
      # Ollama is a second container holding a 3B model, consulted only for
      # high-risk inputs, with a 10s timeout -- double the proxy's entire 5.0s
      # inspection budget. Doubling the footprint for a second opinion is not
      # a free-tier economic.
      OLLAMA_ENABLED: "false"

      # The promptware tracker keys on source_url when no session_id is given.
      # Consumer traffic collapses into a handful of endpoints, so every user
      # would land in the same session bucket -- and this service already has
      # a documented incident where that cross-user state blocked unrelated
      # people's traffic for 30 minutes.
      CYBERARMOR_PROMPTWARE_SESSION_ENABLED: "false"

      DETECTION_API_SECRET: "${AIPROTECT_DETECTION_API_SECRET:?set in aiprotect env}"
      HF_HUB_CACHE: "/models"
      TRANSFORMERS_CACHE: "/models"
      HF_HOME: "/models"
      # The deployment owns the offline guarantee, not the image.
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      # Its OWN model cache. Sharing the B2B hf_models volume would couple the
      # two deployments' seeding and reintroduce exactly the shared fate this
      # file exists to avoid.
      - hf_models:/models
    ports:
      - "127.0.0.1:8102:8002"
    healthcheck:
      # /health is async and answers from the event loop even while every
      # scan thread is busy -- see the comment above _sheds_when_saturated.
      # A sync probe here is what turned "busy" into a restart loop before.
      test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8002/health',timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

  url-trust-gate:
    env_file: ["${CYBERARMOR_ENV_FILE:-.env}"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    build:
      context: ../
      dockerfile: services/url-trust-gate/Dockerfile
    restart: unless-stopped
    environment:
      TRUST_GATE_API_SECRET: "${AIPROTECT_TRUST_GATE_API_SECRET:?set in aiprotect env}"
      DETECTION_URL: "http://detection:8002"
      DETECTION_API_SECRET: "${AIPROTECT_DETECTION_API_SECRET:?set in aiprotect env}"
      AUDIT_SERVICE_URL: "http://audit:8003"
      AUDIT_API_SECRET: "${AIPROTECT_AUDIT_API_SECRET:?set in aiprotect env}"
      # Its OWN spool. Two AuditWriters sharing one would drain each other's
      # files -- each unlinks a spool file once IT has delivered the contents,
      # so the other's pending events vanish undelivered.
      AUDIT_SPOOL_DIR: "/spool"
      # No policy service in this product: consumer presets are evaluated
      # in-process by the API. The gate already degrades to its own
      # score-based verdicts when policy is unreachable, which is the mode it
      # runs in here permanently.
      POLICY_SERVICE_URL: ""
    volumes:
      - url_trust_gate_audit_spool:/spool
    depends_on: [detection, audit]
    ports:
      - "127.0.0.1:8103:8005"

  audit:
    # THE SIGNING KEY REACHES EXACTLY ONE SERVICE.
    # HMAC is symmetric, so any service holding the key can forge a record
    # that verifies. It therefore lives in a file only this service reads --
    # not in the env file every service shares. required:false so a dev
    # machine and CI, where the file does not exist, still start; the real
    # backstop is CYBERARMOR_ENFORCE_SECURE_SECRETS in services/audit/main.py.
    env_file:
      - "${CYBERARMOR_ENV_FILE:-.env}"
      - path: "${CYBERARMOR_AUDIT_ENV_FILE:-/etc/cyberarmor/audit.env}"
        required: false
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    build:
      context: ../
      dockerfile: services/audit/Dockerfile
    restart: unless-stopped
    environment:
      AUDIT_API_SECRET: "${AIPROTECT_AUDIT_API_SECRET:?set in aiprotect env}"
      # Single-user product: tenant_id is never sent, the service defaults it,
      # and the hash chain collapses to one chain. That is correct here --
      # UniqueConstraint("tenant_id","prev_event_id") degenerates rather than
      # breaking. See FORK-PROVENANCE.md.
      DATABASE_URL: "${AIPROTECT_AUDIT_DATABASE_URL:-sqlite:////data/audit.db}"
    volumes:
      - audit_data:/data
    ports:
      - "127.0.0.1:8104:8003"

  api:
    env_file: ["${CYBERARMOR_ENV_FILE:-.env}"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    build:
      context: ../
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      AIPROTECT_DATABASE_URL: "${AIPROTECT_DATABASE_URL:-sqlite:////data/aiprotect.db}"
      AIPROTECT_DETECTION_URL: "http://detection:8002"
      AIPROTECT_TRUST_GATE_URL: "http://url-trust-gate:8005"
      DETECTION_API_SECRET: "${AIPROTECT_DETECTION_API_SECRET:?set in aiprotect env}"
      URL_TRUST_GATE_API_SECRET: "${AIPROTECT_TRUST_GATE_API_SECRET:?set in aiprotect env}"
      # Peppers the hashes of login codes and refresh tokens. A database read
      # must not yield a working credential.
      AIPROTECT_AUTH_PEPPER: "${AIPROTECT_AUTH_PEPPER:?set in aiprotect env}"
      # Never true outside local development: it returns the emailed sign-in
      # code in the HTTP response, which makes the code pointless.
      AIPROTECT_RETURN_LOGIN_CODE: "false"
    volumes:
      - api_data:/data
    depends_on: [detection, url-trust-gate]
    ports:
      - "127.0.0.1:8100:8100"

volumes:
  hf_models:
  url_trust_gate_audit_spool:
  audit_data:
  api_data:

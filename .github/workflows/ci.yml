# CI for AIProtect.
#
# WHAT THIS IS FOR, CONCRETELY
# ----------------------------
# On 2026-08-20 the API image was built and run for the first time. It could
# not start: entitlements.py and presets.py located their data files by
# counting parent directories, which is right in the repository and raises
# IndexError in the image, where apps/api/*.py is flattened into /app. The
# API had never once started in a container -- and the whole test suite passed
# throughout, because tests run from the repository.
#
# That is the shape of defect this workflow exists to catch: something true of
# the repository that is false of the thing customers get. Hence the `image`
# job, which does not merely build the image but RUNS it and asks it questions.
#
# THREE INDEPENDENT JOBS, on purpose. A broken Python test, a broken portal
# and an image that cannot boot are different failures with different owners,
# and none should hide behind another's red X.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A superseded run proves nothing about the commit that replaced it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      # One version's failure must not cancel the other's: when a defect is
      # version-specific, "which versions does this affect" is the first thing
      # you need, and fail-fast throws that answer away.
      fail-fast: false
      matrix:
        # 3.11 is what apps/api/Dockerfile ships. 3.12 is the next step, and
        # keeps this floor aligned with CyberArmor.ai's. Both were verified
        # green before this workflow was written, so a red first run means a
        # real regression rather than an untested guess.
        #
        # NOT 3.13 or 3.14. CyberArmor.ai measured 3.13 as adding failures on
        # 2026-08-19, and 3.14 is what the founder's laptop runs -- which is
        # precisely how a suite can look green locally for weeks while being
        # broken on the versions that ship.
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      # Run each file directly rather than through pytest over services/.
      # Those suites need ~2 GB of ML wheels for 7 of 40 files; see
      # requirements-ci.txt. They are NOT covered here, and this comment is
      # the honest statement of that rather than a green tick implying it.
      - name: API tests
        run: |
          set -e
          for t in apps/api/tests/test_*.py; do
            echo "--- $t"
            PYTHONPATH="$PWD/apps/api" python "$t"
          done

      - name: Pricing is coherent
        run: python tests/test_pricing_is_coherent.py

      # models.py and the migrations must describe the same schema. Every
      # other test builds its database from the models with create_all, so a
      # model changed without a revision passes the whole suite -- and then a
      # deploy migrates to a table WITHOUT the column, starts, reports
      # healthy, and fails on the first request that touches it.
      - name: Schema matches the migrations
        run: make test-schema

      - name: The agent carries no CyberArmor identifiers
        run: make test-agent

      - name: Consumer scope (no tenant_id in apps/)
        run: |
          make verify-consumer-scope-selftest
          make verify-consumer-scope

      # The two library seams this product is built on. If either stops
      # holding, the architecture changed and somebody should know before the
      # next feature lands on top of it.
      - name: Library seams
        run: make verify-seams

  web:
    name: Portal and extension
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '22'          # matches apps/web/Dockerfile
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        working-directory: apps/web
        run: npm ci --no-audit --no-fund

      # The portal's job is to render what the services said WITHOUT
      # flattening it. Every "checked and fine" vs "did not check" distinction
      # dies at one careless ternary, and the backend cannot defend itself
      # from the frontend.
      - name: Portal tests
        run: make test-web

      # The extension's two features fail in OPPOSITE directions on an outage,
      # and both are easy to ship backwards -- neither shows up in manual
      # testing, because manual testing has the API up.
      - name: Extension tests
        run: make test-extension

      - name: Type-check
        working-directory: apps/web
        run: npx tsc --noEmit -p tsconfig.json

      - name: Build
        working-directory: apps/web
        run: npm run build

  image:
    name: API image boots and serves
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      # Building is not the point. STARTING is the point -- see the header.
      - name: Build
        run: docker build -f apps/api/Dockerfile -t aiprotect-api:ci .

      - name: Start
        run: |
          docker run -d --name api -p 8100:8100 \
            -e AIPROTECT_DATABASE_URL="sqlite:////tmp/ci.db" \
            aiprotect-api:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8100/health >/dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "the API never became reachable:"
          docker logs api
          exit 1

      # The migrations must run IN the image. init_db calls alembic in-process
      # so that "the service started" and "the schema is current" cannot come
      # apart; this proves the image actually carries alembic.ini and
      # migrations/, which the Dockerfile's `COPY apps/api/*.py` did not.
      - name: The baseline migration applied
        run: docker logs api 2>&1 | grep -q "Running upgrade" || {
               echo "no migration ran inside the image"; docker logs api; exit 1; }

      - name: It serves its own pricing
        run: |
          curl -fsS http://127.0.0.1:8100/tiers | grep -q '"personal"' || {
            echo "/tiers did not return the tier table"; exit 1; }

      # THE ONE THAT MATTERS FOR BILLING. A holding page answers 200 to every
      # path, and Stripe treats any 2xx as delivered-and-processed and never
      # retries -- so a customer could pay while the event vanished into a
      # static HTML page. The real API refuses an unsigned webhook with 400.
      # Assert the BODY, never the status alone.
      - name: An unsigned webhook is refused, not acknowledged
        run: |
          code=$(curl -s -o /tmp/body -w '%{http_code}' \
                   -X POST http://127.0.0.1:8100/billing/webhook -d '{}')
          cat /tmp/body
          [ "$code" = "400" ] || { echo "expected 400, got $code"; exit 1; }
          grep -q 'invalid_webhook' /tmp/body || {
            echo "body is not the API's refusal -- is something else serving this path?"
            exit 1; }

      - name: Logs
        if: always()
        run: docker logs api 2>&1 | tail -40

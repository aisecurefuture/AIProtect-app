[pytest]
# Duplicate test basenames across suites are DELIBERATE here: the same defect
# gets the same test name on every surface it can occur on. For example
# test_empty_rules_matches_everything.py exists for services/policy AND for
# agents/endpoint-agent, with a .mjs sibling for the browser extension --
# three surfaces, one defect, one name, so a reader grepping the name finds
# every place it was proven.
#
# Under pytest's default "prepend" import mode that parallelism is illegal:
# two test modules with the same basename in directories that are not
# packages collide, collection ABORTS with "import file mismatch", and
# everything after the collision silently never runs. Measured 2026-07-31:
# `pytest services/policy/tests/ agents/endpoint-agent/tests/` aborted, and
# the 225 endpoint-agent tests did not execute. They pass; nobody was running
# them together.
#
# A test suite that silently does not run is the same defect class this repo
# tracks in its product code -- a green result from a check that never
# happened -- so it gets the same treatment: make it impossible rather than
# remembered. importlib mode imports each test file under its full path, so
# the parallel names stay legal and every suite actually executes.
addopts = --import-mode=importlib

# Do NOT descend into JS dependency trees. Adding apps/ to the pytest targets
# made collection walk apps/web/node_modules -- tens of thousands of
# directories -- and `make check` simply stopped finishing. A test run that
# hangs is a test run nobody waits for, which is the same outcome as one that
# never ran.
norecursedirs = node_modules .next dist build .git *.egg-info .venv venv
